name: Create Draft Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --windowed --add-data "assets:assets" --name Quadratic-Invaders src/main.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --add-data "assets:assets" --name Quadratic-Invaders --osx-bundle-identifier com.alfakynz.quadratic-invaders src/main.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --add-data "assets;assets" --name Quadratic-Invaders src/main.py

      - name: Create draft release
        id: create_release
        if: runner.os == 'Linux'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Quadratic Invaders ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body: "-"

      - name: Upload build to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upload_url="${{ steps.create_release.outputs.upload_url }}"
          upload_url="${upload_url%%\{*}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            FILE_PATH="dist/Quadratic-Invaders.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            FILE_PATH="dist/Quadratic-Invaders"
          else
            FILE_PATH="dist/Quadratic-Invaders"
          fi

          if [ ! -e "$FILE_PATH" ]; then
            echo "Build output not found: $FILE_PATH"
            exit 1
          fi

          NAME="$(basename "$FILE_PATH")-${{ runner.os }}"

          curl -sS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$FILE_PATH" \
            "$upload_url?name=$NAME"
