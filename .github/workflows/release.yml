name: Create Draft Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --windowed --add-data "assets:assets" --name Quadratic-Invaders src/main.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --add-data "assets:assets" --name Quadratic-Invaders --osx-bundle-identifier com.quadratic.invaders src/main.py

      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --deep --force --sign - dist/Quadratic-Invaders.app

      - name: Zip macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r Quadratic-Invaders.app.zip Quadratic-Invaders.app
          rm -rf Quadratic-Invaders.app

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --add-data "assets;assets" --name Quadratic-Invaders src/main.py

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Quadratic-Invaders-Linux
          path: dist/Quadratic-Invaders

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Quadratic-Invaders-macOS
          path: dist/Quadratic-Invaders.app.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Quadratic-Invaders-Windows
          path: dist/Quadratic-Invaders.exe

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Quadratic Invaders ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body: "-"

      - name: Upload files to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          upload_url="${{ steps.create_release.outputs.upload_url }}"
          upload_url="${upload_url%%\{*}"

          find artifacts -type f -maxdepth 3 | while read file; do
            name=$(basename "$file")
            curl -sS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "$upload_url?name=$name"
          done
